name: CI

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]

jobs:
  go:
    name: Go Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true
      # main.go 用 //go:embed all:frontend/dist 内嵌前端产物，而 dist 被 .gitignore
      # 忽略 → 干净 checkout 里不存在，go vet / go test 会直接报
      # "pattern all:frontend/dist: no matching files found"。
      # 这里放一个空占位（go:embed all: 连空目录都不接受，必须有文件），
      # 只为让编译通过；真实产物由 frontend job 构建。
      - name: Stub frontend dist (for go:embed)
        run: mkdir -p frontend/dist && printf '' > frontend/dist/index.html
      # wails v3 的 Linux 后端是 cgo（internal/assetserver/webview），go vet /
      # go test 都会实际编译它，需要 GTK4 与 WebKitGTK 6.0 的开发头文件。
      # runner 上没有时 pkg-config 直接报 "Package gtk4 was not found"，整个 job 挂掉。
      - name: Install Linux build dependencies (GTK4 / WebKitGTK 6.0)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libwebkitgtk-6.0-dev
      - name: Go vet
        run: go vet ./...
      - name: Go test
        run: go test -count=1 ./...
      # 绑定漂移门禁（蓝图专项 7）：后端 Service 签名变更后未重新生成
      # bindings 就提交 → 这里直接阻断
      - name: Regenerate Wails bindings and detect drift
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0
          wails3 generate bindings ./... -f '-tags production -trimpath' -clean=true -ts -i -names
          git diff --exit-code frontend/bindings/

  golangci:
    name: Golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27'
      # 与 Go Tests 同理：golangci-lint 的 typecheck 阶段会加载并编译全部包，
      # 缺 GTK4 头文件时报 typecheck 错，缺 dist 时则报
      # "pattern all:frontend/dist: no matching files found"。
      - name: Stub frontend dist (for go:embed)
        run: mkdir -p frontend/dist && printf '' > frontend/dist/index.html
      - name: Install Linux build dependencies (GTK4 / WebKitGTK 6.0)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libwebkitgtk-6.0-dev
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          # 必须 ≥ 用 go1.27 构建的版本：v2.6 是 go1.25 编的，加载 go.mod
          # 里 go 1.27.0/toolchain go1.27.4 的模块会直接 exit 3
          # （"the Go language version used to build golangci-lint is lower
          # than the targeted Go version"）。升级 Go 时同步核对这里。
          version: v2.15.0
          args: --timeout=5m

  frontend:
    name: Frontend Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      # 先装 pnpm，setup-node 才能缓存 pnpm store（~/.local/share/pnpm/store）
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          # pnpm 9 会把只含 overrides/allowBuilds 的 pnpm-workspace.yaml 当工作区
          # 配置并报 "packages field missing or empty"；pnpm 10+ 才允许它作为
          # 纯设置文件。版本与本地开发保持一致。
          version: 12
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Unit tests (Vitest)
        run: pnpm test
      - name: Type check (vue-tsc)
        run: pnpm typecheck
      - name: Build frontend bundle
        run: pnpm build
      # lint 已是阻断门禁：ESLint 配置下 error 才能失败构建，warning（如 v-html 安全提示、
      # 属性换行）不阻断。当前存量 0 errors，新增 error 会在 CI 直接失败。
      - name: Lint
        run: pnpm lint
      # 格式检查仍为信息性：存量约 187 个文件未统一 Prettier 风格，全量格式化会产生
      # 与功能无关的大 diff。待单独开一次纯格式提交后再转为阻断门禁。
      - name: Format check (informational)
        run: pnpm format:check
        continue-on-error: true

  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          # pnpm 9 会把只含 overrides/allowBuilds 的 pnpm-workspace.yaml 当工作区
          # 配置并报 "packages field missing or empty"；pnpm 10+ 才允许它作为
          # 纯设置文件。版本与本地开发保持一致。
          version: 12
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run E2E tests
        run: pnpm exec playwright test
      # 报告（含失败 trace）归档到 Actions artifacts，便于排查
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
      - name: Upload test results & traces
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: frontend/test-results/
          retention-days: 7
