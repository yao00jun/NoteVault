name: Release

# 触发：推送 vX.Y.Z tag（或手动指定已有 tag 重跑）。
# 产物：Windows 安装包 + 裸 exe、macOS dmg、Linux tar.gz/deb/rpm/aur/AppImage，全部挂到 GitHub Release。
#
# 与本地 `wails3 task release VERSION=vX.Y.Z` 的关系：
#   本地脚本负责「构建 → 冒烟 → 推送 → 建 Release」；
#   这里负责在干净环境里跨三个平台重建产物（本地只能出 Windows 包）。
#   两条路径的产物命名规则保持一致，便于互相替换。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: '已存在的 tag（如 v0.2.0），用于重跑发布'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  GO_VERSION: '1.27'
  NODE_VERSION: '22'
  PNPM_VERSION: '12'    # 需 ≥10：frontend/pnpm-workspace.yaml 只放 overrides，pnpm 9 会报错
  WAILS_VERSION: 'v3.1.0'

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows：exe + NSIS 安装包（windows-latest 自带 makensis）
          - os: windows-latest
            label: windows-amd64
            package: installer
          # macOS：dmg（arm64 与 x86_64 各出一份，Intel 机器仍可用）。
          # 两个 job 都跑 macos-latest（Apple Silicon）：arm64 原生编译，
          # amd64 走 Apple clang 交叉（go 对 darwin cgo 自动传 -arch）。
          # 不要用 macos-14/macos-13：前者触发即被取消，后者长期排队不分配。
          - os: macos-latest
            label: darwin-arm64
            package: dmg
            arch: arm64
          - os: macos-latest
            label: darwin-amd64
            package: dmg
            arch: amd64
          # Linux：tar.gz + deb + rpm + AppImage。deb/rpm 走 wails3 内置的
          # nfpm（纯 Go，无需 rpmbuild/dpkg 工具链）；AppImage 需联网下载 linuxdeploy。
          - os: ubuntu-24.04
            label: linux-amd64
            package: linux

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-24.04'
        # 必须在安装 wails3 CLI 之前：go install 编译 CLI 本身就要 GTK4 头文件
        # （Wails v3 的 Linux 后端是 CGO + GTK4 + WebKitGTK 6.0，不是 v2 的 GTK3）。
        # 官方支持矩阵以 Ubuntu 24.04 为基线，故构建机也钉在 24.04；
        # 代价是产物要求目标机 glibc ≥ 2.39（22.04 及更早跑不起来）。
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libgtk-4-dev libwebkitgtk-6.0-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - name: Install Wails v3 CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@${{ env.WAILS_VERSION }}

      # windows-latest 镜像不再预装 NSIS（首跑实测 makensis 不在 PATH）；
      # choco 的 nsis 包走自家安装器、不自动建 shim，需手动把安装目录挂进 GITHUB_PATH
      - name: Install NSIS
        if: runner.os == 'Windows'
        run: |
          choco install nsis -y --no-progress
          Add-Content $env:GITHUB_PATH "C:\Program Files (x86)\NSIS"

      - name: Resolve version
        shell: bash
        # tag 是版本号的唯一来源：产物文件名、ldflags 注入、Release 标题都取它
        run: echo "VERSION=${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}" >> "$GITHUB_ENV"

      - name: Build Windows installer + binaries
        if: matrix.package == 'installer'
        shell: bash
        # 根任务 package = 平台安装包 + MCP 二进制，两个产物版本必然一致
        run: wails3 task package VERSION="$VERSION"

      - name: Build macOS dmg
        if: matrix.package == 'dmg'
        shell: bash
        # ARCH 经 CLI 全局变量透传到 build:native 的 GOARCH（与 VERSION 同机制）；
        # MCP 是零 CGO 纯 Go 二进制，直接交叉编译出对应架构
        run: |
          # Info.plist 里的版本号（CFBundleVersion / CFBundleShortVersionString）
          # 是本地兜底默认值，CI 按 tag 覆写，dmg 内应用版本与 Release 一致。
          # 不用 sed -i：macOS 的 BSD sed 会把 -i 后的第一个参数当备份后缀吞掉
          #（首跑踩坑），改为输出到临时文件再替换
          plist_ver="${VERSION#v}"
          sed -e "/CFBundleVersion/{n; s|<string>.*</string>|<string>$plist_ver</string>|;}" \
              -e "/CFBundleShortVersionString/{n; s|<string>.*</string>|<string>$plist_ver</string>|;}" \
              build/darwin/Info.plist > build/darwin/Info.plist.tmp \
            && mv build/darwin/Info.plist.tmp build/darwin/Info.plist
          wails3 task darwin:package:dmg VERSION="$VERSION" ARCH="${{ matrix.arch }}"
          GOARCH="${{ matrix.arch }}" wails3 task mcp:build

      - name: Build Linux binaries and packages
        if: matrix.package == 'linux'
        shell: bash
        env:
          # linuxdeploy 是 AppImage 自身，runner 没有 FUSE，只能解包运行
          APPIMAGE_EXTRACT_AND_RUN: '1'
          # nfpm.yaml 的 arch: ${GOARCH} 靠环境变量展开，Actions 默认不导出它
          GOARCH: amd64
        run: |
          # deb/rpm 的版本号进包名与元数据：nfpm.yaml 里写的是本地兜底默认值，
          # CI 按当前 tag 覆写（去掉 v 前缀），保证与 Release 版本一致
          sed -i "s/^version: .*/version: \"${VERSION#v}\"/" build/linux/nfpm/nfpm.yaml
          wails3 task linux:build VERSION="$VERSION"
          wails3 task mcp:build
          # 三个打包任务各自依赖 build：go build 有缓存，多跑几次只是重复 vite 构建
          wails3 task linux:create:deb
          wails3 task linux:create:rpm
          wails3 task linux:create:aur
          wails3 task linux:create:appimage

      # 统一产物命名，并把 MCP 二进制一并打包（它不在安装包里）
      - name: Collect release assets
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          mkdir -p release
          case "${{ matrix.label }}" in
            windows-amd64)
              cp bin/notevault.exe "release/notevault-${VERSION}-windows-amd64.exe"
              cp bin/notevault-mcp.exe "release/notevault-mcp-${VERSION}-windows-amd64.exe"
              cp bin/notevault-amd64-installer.exe "release/notevault-${VERSION}-windows-amd64-installer.exe"
              ;;
            darwin-arm64)
              cp bin/notevault "release/notevault-${VERSION}-darwin-arm64"
              cp bin/notevault-mcp "release/notevault-mcp-${VERSION}-darwin-arm64"
              # wails3 tool package 的 dmg 文件名随版本/架构变化，用 glob 兜底
              cp "$(ls bin/*.dmg | head -1)" "release/notevault-${VERSION}-darwin-arm64.dmg"
              ;;
            darwin-amd64)
              cp bin/notevault "release/notevault-${VERSION}-darwin-amd64"
              cp bin/notevault-mcp "release/notevault-mcp-${VERSION}-darwin-amd64"
              cp "$(ls bin/*.dmg | head -1)" "release/notevault-${VERSION}-darwin-amd64.dmg"
              ;;
            linux-amd64)
              tar -czf "release/notevault-${VERSION}-linux-amd64.tar.gz" -C bin notevault notevault-mcp
              cp bin/*.deb "release/notevault-${VERSION}-linux-amd64.deb"
              cp bin/*.rpm "release/notevault-${VERSION}-linux-amd64.rpm"
              # aur：pacman -U 可直接安装的二进制包（.pkg.tar.zst）
              cp bin/*.pkg.tar.zst "release/notevault-${VERSION}-linux-amd64.pkg.tar.zst"
              # AppImage 名为 <name>-<arch>.AppImage（wails3 generate appimage 输出约定）
              cp bin/notevault*.AppImage "release/notevault-${VERSION}-linux-amd64.AppImage"
              ;;
          esac
          ls -lh release

      - name: Upload assets
        uses: actions/upload-artifact@v4
        with:
          name: assets-${{ matrix.label }}
          path: release/*
          retention-days: 7

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: assets-*
          merge-multiple: true
          path: release

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          # 手动重跑时用输入的 tag，否则用推送的 tag
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          # 发布说明由提交历史自动生成；需要人工润色时可在 Release 页面直接编辑
          generate_release_notes: true
          # 预发布版本（如 v0.2.0-beta.1）自动打上 prerelease 标记
          prerelease: ${{ contains(github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name, '-') }}
          files: release/*
          fail_on_unmatched_files: true
