# Feel free to remove those if you don't want/need to use them.
# Make sure to check the documentation at https://nfpm.goreleaser.com
#
# The lines below are called `modelines`. See `:help modeline`

# version 是本地兜底默认值；CI（release.yml）在打包前按当前 tag
# sed 覆写为真实版本号，保证 deb/rpm 的包名与元数据跟 Release 一致。
name: "notevault"
arch: ${GOARCH}
platform: "linux"
version: "0.1.0"
section: "default"
priority: "extra"
# 不用 ${GIT_COMMITTER_NAME}：GitHub Actions 不保证导出该环境变量，
# 展开成空值会让 nfpm 校验失败。
maintainer: "NoteVault Maintainers <notevault@users.noreply.github.com>"
description: "本地优先的个人知识库与研发工作台"
vendor: "NoteVault"
homepage: "https://github.com/yao00jun/NoteVault"
license: "Apache-2.0"
release: "1"

contents:
  - src: "./bin/notevault"
    dst: "/usr/local/bin/notevault"
  - src: "./build/appicon.png"
    dst: "/usr/share/icons/hicolor/128x128/apps/notevault.png"
  - src: "./build/linux/notevault.desktop"
    dst: "/usr/share/applications/notevault.desktop"

# Default dependencies for the GTK4 + WebKitGTK 6.0 stack (Ubuntu 24.04+ / Debian 13+)
depends:
  - libgtk-4-1
  - libwebkitgtk-6.0-4

# Distribution-specific overrides for different package formats
overrides:
  # RPM packages for Fedora / RHEL / AlmaLinux / Rocky Linux
  rpm:
    depends:
      - gtk4
      - webkitgtk6.0

  # Arch Linux packages
  archlinux:
    depends:
      - gtk4
      - webkitgtk-6.0

# scripts section to ensure desktop database is updated after install
scripts:
  postinstall: "./build/linux/nfpm/scripts/postinstall.sh"
  # You can also add preremove, postremove if needed
  # preremove: "./build/linux/nfpm/scripts/preremove.sh"
  # postremove: "./build/linux/nfpm/scripts/postremove.sh"

# If you build your app with -tags gtk3 (legacy WebKit2GTK 4.1 stack — supported through v3.0.x, removed in v3.1),
# replace the depends/overrides above with these:
#
# depends:
#   - libgtk-3-0
#   - libwebkit2gtk-4.1-0
# overrides:
#   rpm:
#     depends:
#       - gtk3
#       - webkit2gtk4.1
#   archlinux:
#     depends:
#       - gtk3
#       - webkit2gtk-4.1
#
# replaces:
#   - foobar
# provides:
#   - bar
# recommends:
#   - whatever
# suggests:
#   - something-else
# conflicts:
#   - not-foo
#   - not-bar
# changelog: "changelog.yaml"
