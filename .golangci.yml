# golangci-lint v2 配置
# 本地运行: golangci-lint run ./...
# CI 运行: golangci/golangci-lint-action@v8
version: "2"

linters:
  # standard 默认启用: errcheck / govet / ineffassign / staticcheck / unused
  default: standard
  enable:
    - gosec       # 安全扫描（G 系列检查）
    - misspell    # 常见拼写错误
  settings:
    gosec:
      excludes:
        - G304 # 导出/打包按用户指定路径写文件，动态路径是设计使然
        - G306 # 用户数据文件用 0644，刻意保证跨工具可读（非凭据文件）
        - G404 # 弱随机数：提醒 ID 非安全场景，允许 math/rand
        - G301 # 同上：目录用 0750/0755 以便同步工具与其他程序读取
        - G302 # 同上：普通数据文件 0644；凭据走 DPAPI，不落磁盘
        # G115（整数转换溢出）全部是「值域由上游构造保证」的尺寸/字节截断，
        # 例如 byte(now>>(i*8))、uint32(len(blob)*2)。逐处加注释只会淹没代码。
        - G115
        # G122（WalkDir 内文件操作 TOCTOU）：快照/GC 只在受管目录内遍历，
        # 攻击面是本地同机用户，已超出本应用的威胁模型。
        - G122
  exclusions:
    generated: lax
    rules:
      # 测试文件：允许忽略错误返回与弱随机数（测试注重可读性）
      - path: _test\.go
        linters:
          - gosec
          - errcheck
      # Wails 生成的平台胶水代码（build/ 目录）
      - path: build/
        linters:
          - gosec
          - unused
      # 导出服务：按用户指定路径写入/遍历是功能本身（G122/G703 误报）
      - path: exportservice\.go
        linters:
          - gosec
        text: "G122|G703"
      # MCP 命令行入口：--workspace 就是用户显式指定的工作区路径。
      # gosec 的 taint 分析按数据流报 G703，行内 nolint 无法压掉（位置对不上节点）。
      - path: cmd/notevault-mcp/main\.go
        linters:
          - gosec
        text: "G703"

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    paths:
      - build/
