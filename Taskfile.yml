version: '3'

vars:
  APP_NAME: "notevault"
  BIN_DIR: "bin"
  PACKAGE_MANAGER: '{{.PACKAGE_MANAGER | default "pnpm"}}'
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'
  # Target OS for build/package/run. Defaults to the host OS, and is overridden
  # by `wails3 build GOOS=...` (or the GOOS env var) for cross-compilation. The
  # tasks below dispatch to the matching platform Taskfile via this variable.
  GOOS: '{{.GOOS | default OS}}'

includes:
  common: ./build/Taskfile.yml
  windows: ./build/windows/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml
  linux: ./build/linux/Taskfile.yml
  # 移动端（iOS / Android）模板已移除：NoteVault 定位为桌面应用，不做移动端。

tasks:
  build:
    summary: Builds the application
    cmds:
      - task: "{{.GOOS}}:build"

  package:
    summary: Packages a production build of the application
    cmds:
      - task: "{{.GOOS}}:package"
      # 客户端与 MCP 服务二进制一起出包，避免 bin 里两个可执行文件版本不一致
      - task: mcp:build

  mcp:build:
    summary: 构建独立 MCP 服务二进制（stdio JSON-RPC），与客户端同目录
    cmds:
      # -o 以路径分隔符结尾时由 go 自己补 .exe，跨平台无需分支
      # 版本号必须与客户端同源注入，否则 install 包里两个可执行文件各报一个版本
      - go build -tags production -trimpath -buildvcs=false -ldflags="-w -s{{if .VERSION}} -X github.com/notevault/notevault/internal/core.AppVersion={{.VERSION}}{{end}}" -o "{{.BIN_DIR}}/" ./cmd/notevault-mcp

  run:
    summary: Runs the application
    cmds:
      - task: "{{.GOOS}}:run"

  dev:
    summary: Runs the application in development mode
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}

  e2e:exe:
    summary: Runs exe-level smoke test against the production binary (Windows)
    platforms: [windows]
    deps:
      - task: windows:build
    cmds:
      - bash e2e/exe-smoke.sh
    post:
      - cmd: powershell -NoProfile -Command "Get-Process notevault -ErrorAction SilentlyContinue | Stop-Process -Force"
        platforms: [windows]
        ignore_error: true

  release:
    summary: 发布 GitHub Release（VERSION=vX.Y.Z）：构建 → 冒烟 → 推送 → gh release create
    platforms: [windows]
    preconditions:
      - sh: 'test -n "{{.VERSION}}"'
        msg: "缺少版本号，用法：wails3 task release VERSION=v0.2.0"
    deps:
      - task: windows:build
    cmds:
      - bash scripts/release.sh {{.VERSION}}

  setup:docker:
    summary: Builds Docker image for cross-compilation (~800MB download)
    cmds:
      - task: common:setup:docker

  build:server:
    summary: Builds the application in server mode (no GUI, HTTP server only)
    cmds:
      - task: common:build:server

  run:server:
    summary: Runs the application in server mode
    cmds:
      - task: common:run:server

  build:docker:
    summary: Builds a Docker image for server mode deployment
    cmds:
      - task: common:build:docker

  run:docker:
    summary: Builds and runs the Docker image
    cmds:
      - task: common:run:docker
